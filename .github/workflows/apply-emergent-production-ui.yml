name: Apply Emergent Production UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-emergent-production-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Port Emergent visual system
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/page.tsx'); s=p.read_text()
          reps={
          'fixed bottom-0 left-0 top-0 z-40 hidden w-[248px] flex-col border-r border-slate-200 bg-white text-slate-800 shadow-[8px_0_30px_rgba(15,23,42,.06)] lg:flex':'fixed bottom-0 left-0 top-0 z-40 hidden w-[248px] flex-col border-r border-slate-200 bg-white text-slate-800 lg:flex',
          'text-[42px] leading-none text-orange-500':'flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-orange-500 to-orange-600 text-xl text-white shadow-sm',
          'text-[19px] font-black tracking-tight text-[#12315b]':'text-[15px] font-bold tracking-tight text-slate-900',
          'mt-0.5 text-[12px] font-bold tracking-[.08em] text-[#12315b]':'text-[10px] font-semibold tracking-[.15em] text-slate-500',
          'sticky top-0 z-30 flex min-h-[76px] items-center gap-3 border-b border-slate-200 bg-white/95 px-4 py-3 shadow-sm backdrop-blur-xl sm:px-5 lg:px-7':'sticky top-0 z-30 flex min-h-[64px] items-center gap-3 border-b border-slate-200 bg-white px-4 py-2.5 sm:px-5 lg:px-6',
          'w-full rounded-xl border border-slate-200 bg-[#f8fafc] py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10':'w-full rounded-lg border border-slate-200 bg-white py-2.5 pl-10 pr-4 text-[13px] text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10',
          'grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-4':'grid grid-cols-2 gap-3.5 xl:grid-cols-4',
          'mt-5 grid min-w-0 max-w-full grid-cols-[minmax(0,1fr)] scroll-mt-24 items-stretch gap-5 xl:grid-cols-[minmax(0,.72fr)_minmax(0,1.28fr)]':'mt-5 grid min-w-0 max-w-full grid-cols-[minmax(0,1fr)] scroll-mt-24 items-stretch gap-3.5 xl:grid-cols-[minmax(0,2fr)_minmax(0,3fr)]',
          'rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-400 hover:text-white':'rounded-md border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s)
          css=Path('app/globals.css'); c=css.read_text(); marker='/* EMERGENT EXACT PORT 2026-09-17 */'
          if marker not in c:
            c += '''\n\n/* EMERGENT EXACT PORT 2026-09-17 */\n:root{--em-navy:#0F2A47;--em-page:#f8fafc;--em-border:#e2e8f0}\nbody{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif!important;background:var(--em-page)!important}\naside{box-shadow:none!important}\naside .bg-blue-600,aside button.bg-blue-600{background:var(--em-navy)!important;box-shadow:0 1px 2px rgba(15,42,71,.14)!important}\nheader{box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\nmain{background:var(--em-page)!important}\nmain .rounded-2xl{border-radius:10px!important}\nmain .border-slate-200{border-color:var(--em-border)!important}\nmain .shadow-sm{box-shadow:0 1px 2px rgba(15,23,42,.04)!important}\n'''
            css.write_text(c)
      - run: npm ci
      - run: npm run build
      - name: Commit production UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: apply Emergent UI across production app"
          git push origin main