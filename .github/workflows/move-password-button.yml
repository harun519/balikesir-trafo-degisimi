name: Move password button
on:
  push:
    paths:
      - '.github/workflows/move-password-button.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move button to sidebar area
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/CentralPasswordChange.tsx')
          s=p.read_text(encoding='utf-8')
          old='launch:{position:"fixed",right:18,bottom:18,zIndex:9000,border:"1px solid #cbd5e1",borderRadius:12,background:"#fff",color:"#17345f",padding:"11px 14px",fontWeight:800,boxShadow:"0 10px 28px rgba(15,23,42,.14)",cursor:"pointer",display:"flex",gap:7,alignItems:"center"}'
          new='launch:{position:"fixed",left:8,bottom:58,zIndex:9000,width:194,border:"1px solid #cbd5e1",borderRadius:12,background:"#fff",color:"#17345f",padding:"9px 12px",fontWeight:800,boxShadow:"0 4px 14px rgba(15,23,42,.08)",cursor:"pointer",display:"flex",gap:7,alignItems:"center",justifyContent:"center",fontSize:12}'
          if old not in s: raise SystemExit('password launch style anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CentralPasswordChange.tsx
          git commit -m "Move password change button to sidebar"
          git push
