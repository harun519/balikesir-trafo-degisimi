name: Optimize tablet map and live sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-tablet-map-sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Trafo map performance and sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/TrafoHarita.tsx')
          s=p.read_text(encoding='utf-8')

          old='''  const mapEl = useRef<HTMLDivElement | null>(null), mapRef = useRef<any>(null), pointLayer = useRef<any>(null), buildingLayer = useRef<any>(null), tileLayer = useRef<any>(null), pointData = useRef<GeoJSON | null>(null), buildingData = useRef<GeoJSON | null>(null);'''
          new='''  const mapEl = useRef<HTMLDivElement | null>(null), mapRef = useRef<any>(null), pointLayer = useRef<any>(null), buildingLayer = useRef<any>(null), tileLayer = useRef<any>(null), pointData = useRef<GeoJSON | null>(null), buildingData = useRef<GeoJSON | null>(null), buildingKeyRef = useRef(""), fitKeyRef = useRef("");'''
          if old in s: s=s.replace(old,new,1)

          old='''[degisimFiltre, setDegisimFiltre] = useState<DegisimFiltre>("TUMU"), [noktaAcik, setNoktaAcik] = useState(true), [binaAcik, setBinaAcik] = useState(true), [noktaSayisi'''
          new='''[degisimFiltre, setDegisimFiltre] = useState<DegisimFiltre>("TUMU"), [noktaAcik, setNoktaAcik] = useState(true), [binaAcik, setBinaAcik] = useState(() => typeof window === "undefined" ? true : !window.matchMedia("(max-width: 1100px), (pointer: coarse)").matches), [noktaSayisi'''
          if old in s: s=s.replace(old,new,1)

          old='''    yukle(); oturumBilgisi().catch(() => {});
    return () => { kapandi = true; };
  }, [supabase]);'''
          new='''    let yenileTimer = 0;
    const yenile = () => {
      window.clearTimeout(yenileTimer);
      yenileTimer = window.setTimeout(() => { if (!kapandi) yukle(); }, 120);
    };
    yukle(); oturumBilgisi().catch(() => {});
    window.addEventListener("trafo-kayit-guncellendi", yenile as EventListener);
    window.addEventListener("trafo-harita-ac", yenile as EventListener);
    const gorunur = () => { if (document.visibilityState === "visible") yenile(); };
    document.addEventListener("visibilitychange", gorunur);
    const kanal = supabase?.channel("trafo-harita-canli")
      .on("postgres_changes", { event: "*", schema: "public", table: "trafo_degisim" }, yenile)
      .subscribe();
    return () => {
      kapandi = true;
      window.clearTimeout(yenileTimer);
      window.removeEventListener("trafo-kayit-guncellendi", yenile as EventListener);
      window.removeEventListener("trafo-harita-ac", yenile as EventListener);
      document.removeEventListener("visibilitychange", gorunur);
      if (kanal) supabase?.removeChannel(kanal);
    };
  }, [supabase]);'''
          if old in s: s=s.replace(old,new,1)

          old='''    if (pointLayer.current) { map.removeLayer(pointLayer.current); pointLayer.current = null; }
    if (buildingLayer.current) { map.removeLayer(buildingLayer.current); buildingLayer.current = null; }
    const q = arama.trim().toLocaleLowerCase("tr-TR");'''
          new='''    if (pointLayer.current) { map.removeLayer(pointLayer.current); pointLayer.current = null; }
    const q = arama.trim().toLocaleLowerCase("tr-TR");
    const buildingKey = [ilce, q, mulkiyetFiltre, degisimFiltre, binaAcik ? "1" : "0"].join("|");
    const buildingChanged = buildingKeyRef.current !== buildingKey;
    if (buildingChanged && buildingLayer.current) { map.removeLayer(buildingLayer.current); buildingLayer.current = null; }'''
          if old in s: s=s.replace(old,new,1)

          old='''    if (binaAcik && degisimFiltre === "TUMU") buildingLayer.current = L.geoJSON(bins, { style: () => ({ color: "#6d28d9", weight: 1.5, fillColor: "#8b5cf6", fillOpacity: .16 }), onEachFeature: (f: any, l: any) => l.bindPopup(binaPopup(f.properties || {}), { maxWidth: 320 }) }).addTo(map);'''
          new='''    if (buildingChanged) {
      if (binaAcik && degisimFiltre === "TUMU") buildingLayer.current = L.geoJSON(bins, { style: () => ({ color: "#6d28d9", weight: 1.5, fillColor: "#8b5cf6", fillOpacity: .16 }), onEachFeature: (f: any, l: any) => l.bindPopup(binaPopup(f.properties || {}), { maxWidth: 320 }) }).addTo(map);
      buildingKeyRef.current = buildingKey;
    }'''
          if old in s: s=s.replace(old,new,1)

          old='''    const layers = [pointLayer.current, buildingLayer.current].filter(Boolean);
    if (layers.length) {
      const bounds = L.featureGroup(layers).getBounds();
      if (bounds.isValid() && (ilce || q || tipFiltre || mulkiyetFiltre || degisimFiltre !== "TUMU")) map.fitBounds(bounds.pad(.08), { maxZoom: q ? 17 : 12 });
      else if (bounds.isValid()) map.fitBounds(bounds.pad(.04), { maxZoom: 11 });
    }'''
          new='''    const fitKey = [ilce, q, tipFiltre, mulkiyetFiltre, degisimFiltre, noktaAcik ? "1" : "0", binaAcik ? "1" : "0"].join("|");
    if (fitKeyRef.current !== fitKey) {
      const layers = [pointLayer.current, buildingLayer.current].filter(Boolean);
      if (layers.length) {
        const bounds = L.featureGroup(layers).getBounds();
        if (bounds.isValid() && (ilce || q || tipFiltre || mulkiyetFiltre || degisimFiltre !== "TUMU")) map.fitBounds(bounds.pad(.08), { maxZoom: q ? 17 : 12 });
        else if (bounds.isValid()) map.fitBounds(bounds.pad(.04), { maxZoom: 11 });
      }
      fitKeyRef.current = fitKey;
    }'''
          if old in s: s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          h=Path('app/HaritaEntegrasyon.tsx')
          hs=h.read_text(encoding='utf-8')
          old='<TrafoHarita/>'
          new='{acik&&<TrafoHarita/>}'
          if old in hs: hs=hs.replace(old,new,1)
          h.write_text(hs,encoding='utf-8')
          PY

      - name: Commit optimized map
        shell: bash
        run: |
          if git diff --quiet -- app/TrafoHarita.tsx app/HaritaEntegrasyon.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/TrafoHarita.tsx app/HaritaEntegrasyon.tsx
          git commit -m "Speed up tablet map and refresh changes live"
          git push
