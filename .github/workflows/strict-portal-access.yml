name: Strict Portal Access
on:
  push:
    paths:
      - '.github/workflows/strict-portal-access.yml'
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce assigned Trafo role before loading data
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='''  const [kullaniciRolu,setKullaniciRolu]=useState<KullaniciRolu>("viewer");\n'''
          new='''  const [kullaniciRolu,setKullaniciRolu]=useState<KullaniciRolu>("viewer");\n  const [yetkiHazir,setYetkiHazir]=useState(false);\n'''
          if old not in s: raise SystemExit('role state not found')
          s=s.replace(old,new,1)
          old='''  useEffect(()=>{ if(session||misafirModu) kayitlariGetir(); else setKayitlar([]); },[session,misafirModu]);\n  useEffect(()=>{ if(session||misafirModu){arsivKayitlariniGetir();driveSyncLoglariniGetir();} else {setArsivKayitlari([]);setDriveSyncLoglar([]);} },[session,misafirModu]);\n  useEffect(()=>{\n    if(session){kullaniciProfiliniGetir();}else{setKullaniciRolu("viewer");setKullanicilar([]);setAuditLoglar([]);}\n  },[session]);\n'''
          new='''  useEffect(()=>{ if(session&&yetkiHazir) kayitlariGetir(); else setKayitlar([]); },[session,yetkiHazir]);\n  useEffect(()=>{ if(session&&yetkiHazir){arsivKayitlariniGetir();driveSyncLoglariniGetir();} else {setArsivKayitlari([]);setDriveSyncLoglar([]);} },[session,yetkiHazir]);\n  useEffect(()=>{\n    setYetkiHazir(false);\n    if(session){void kullaniciProfiliniGetir();}else{setKullaniciRolu("viewer");setKullanicilar([]);setAuditLoglar([]);}\n  },[session]);\n'''
          if old not in s: raise SystemExit('data effects not found')
          s=s.replace(old,new,1)
          old='''  async function kullaniciProfiliniGetir(){\n    if(!supabase||!session)return;\n    const {data,error}=await supabase.from("app_users").select("id,email,role,created_at,updated_at").eq("id",session.user.id).maybeSingle();\n    if(error){setKullaniciRolu("viewer");return;}\n    setKullaniciRolu((data?.role||"viewer") as KullaniciRolu);\n  }\n'''
          new='''  async function kullaniciProfiliniGetir(){\n    if(!supabase||!session)return;\n    const {data,error}=await supabase.from("app_users").select("id,email,role,created_at,updated_at").eq("id",session.user.id).maybeSingle();\n    const rol=data?.role;\n    if(error||!data||!["admin","editor","viewer"].includes(String(rol))){\n      setYetkiHazir(false);\n      setKullaniciRolu("viewer");\n      setAuthHata("Bu kullanıcıya Trafo Değişimi erişimi tanımlı değil. Portal Kullanıcı Yönetimi üzerinden yetki verilmelidir.");\n      await supabase.auth.signOut();\n      return;\n    }\n    setKullaniciRolu(rol as KullaniciRolu);\n    setYetkiHazir(true);\n  }\n'''
          if old not in s: raise SystemExit('profile function not found')
          s=s.replace(old,new,1)
          old='''  useEffect(()=>{if(session||misafirModu)trafoMarkalariniGetir();else setTrafoMarkalari([]);},[session,misafirModu]);\n'''
          new='''  useEffect(()=>{if(session&&yetkiHazir)trafoMarkalariniGetir();else setTrafoMarkalari([]);},[session,yetkiHazir]);\n'''
          if old not in s: raise SystemExit('brands effect not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Require assigned Trafo role before loading data' || exit 0
          git push
